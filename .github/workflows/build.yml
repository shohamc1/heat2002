name: build

on: [push, pull_request]

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # tools/agbcc is a private fork; the default GITHUB_TOKEN can't clone it.
          token: ${{ secrets.AGBCC_PAT }}

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Build agbcc
        run: cd tools/agbcc && ./build.sh

      # baserom.gba is deliberately never supplied to CI: nothing in the
      # build reads it (only `make disasm` does), and `make check` compares
      # the produced ROM against the sha1 committed in nascar-heat.sha1 --
      # the same fingerprint the project's correctness rule is written on.
      # The ROM stays on the developer's machine in every form.
      - name: Build and verify byte-for-byte match
        run: make -j"$(nproc)" check
