name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Build agbcc
        run: cd tools/agbcc && ./build.sh

      # baserom.gba is deliberately never supplied to CI; the ROM stays on
      # the developer's machine in every form. Without it the build fills
      # each assets/*.json range with zeros, and check-code compares every
      # other byte (the code and the data still in data/) against
      # nascar-heat.code.sha1: the retail ROM with those ranges zeroed.
      - name: Build and verify every byte outside the extracted assets
        run: make -j"$(nproc)" check-code

      - name: Generate decomp.dev report
        run: |
          python3 scripts/test_progress.py
          python3 scripts/progress.py --check-code --json

      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: usa_report
          path: report.json
          if-no-files-found: error

  # The SDL port compiles with the same zero-filled assets as check-code
  # uses without a ROM, so it cannot silently rot behind the GBA build.
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Compile the port
        run: make -j"$(nproc)" PLATFORM=sdl

      # A bounded headless run of what CI just built: with HEADLESS=true
      # main() never touches SDL and the dummy drivers stand in for a
      # display anyway, Soak_Advance counts frames and FRAME_LIMIT exits
      # 0 at 500. No `|| true`: a crash or a hang fails the job (the
      # `timeout` backstops a hang FRAME_LIMIT could not reach). The
      # zero-filled assets make the boot splashes' compressed blobs
      # zero-length; the platform's uncompression wrappers skip those
      # where the GBA BIOS would quietly do nothing, so the run stays
      # clean (verified 500 frames locally on such a build).
      - name: Headless smoke run
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
          HEADLESS=true FRAME_LIMIT=500 timeout 120 ./build/sdl/nascar-heat.sdl
