name: build

on: [push, pull_request]

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Build agbcc
        run: cd tools/agbcc && ./build.sh

      # baserom.gba is deliberately never supplied to CI; the ROM stays on
      # the developer's machine in every form. Without it the build fills
      # each assets/*.json range with zeros, and check-code compares every
      # other byte (the code and the data still in data/) against
      # nascar-heat.code.sha1: the retail ROM with those ranges zeroed.
      - name: Build and verify every byte outside the extracted assets
        run: make -j"$(nproc)" check-code

      # The shift test boots this build and a copy linked with padding after
      # crt0 in mGBA, and checks that both load the same assets, draw the
      # same screens and hold the same RAM (scripts/shift_test.py). Without
      # baserom.gba the data is zero fill, so here it covers the boot and the
      # first 600 frames; run `make shift-test` with the ROM for the rest.
      - name: Install mGBA
        run: sudo apt-get install -y mgba-sdl xvfb

      - name: Shift test
        run: xvfb-run -a make shift-test

      - name: Upload the shift test's screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-test
          path: build/shift-test/
          if-no-files-found: ignore
